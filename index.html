<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Villa da Serra</title>
<link rel="icon" type="image/png" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<meta name="description" content="Guias do hóspede da Villa da Serra, locações de temporada.">
<meta property="og:title" content="Villa da Serra">
<meta property="og:description" content="Guias do hóspede das nossas locações de temporada.">
<meta property="og:image" content="golden-sea/capa.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Karla:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --areia:#D5D5D1; --papel:#F1F1EE; --branco:#FFFFFF;
  --tinta:#16272F; --suave:#687C86; --mar:#13596E; --linha:#E0DFD9;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--papel); color:var(--tinta);
  font-family:"Karla","Helvetica Neue",Arial,sans-serif;
  font-size:16px; line-height:1.6; -webkit-font-smoothing:antialiased;
}
@media (min-width:720px){
  body{background:radial-gradient(900px 520px at 50% -10%,#C6D6DA 0%,rgba(198,214,218,0) 70%),var(--areia);padding:28px 16px}
}
.app{max-width:468px;margin:0 auto;background:var(--papel);min-height:100vh;padding:0 22px 48px}
@media (min-width:720px){
  .app{min-height:0;border-radius:24px;box-shadow:0 24px 60px rgba(22,39,47,.13);overflow:hidden;padding-bottom:40px}
}
header{text-align:center;padding:52px 0 8px}
h1{
  font-family:"Cormorant Garamond",Georgia,serif; font-weight:500; font-size:40px;
  letter-spacing:.09em; text-transform:uppercase; margin:0; line-height:1;
}
.sub{font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-size:22px;color:var(--mar);margin-top:4px}
.rotulo{
  margin:40px 0 14px; font-size:11px; letter-spacing:.17em;
  text-transform:uppercase; color:var(--suave); font-weight:600;
}
.cartao{
  display:block; text-decoration:none; color:inherit;
  background:var(--branco); border:1px solid var(--linha);
  border-radius:16px; overflow:hidden; margin-bottom:14px;
}
.cartao:hover{border-color:#C9C8C1}
.cartao img{width:100%;aspect-ratio:16/10;object-fit:cover;display:block}
.cartao .corpo{padding:16px 18px 18px}
.cartao h2{margin:0;font-size:19px;font-weight:600;letter-spacing:.01em}
.cartao p{margin:3px 0 0;font-size:14px;color:var(--suave)}
.cartao .abrir{
  display:inline-block;margin-top:13px;color:var(--mar);font-size:11.5px;
  font-weight:700;letter-spacing:.14em;text-transform:uppercase;
}
.rodape{text-align:center;color:var(--suave);font-size:11px;letter-spacing:.14em;text-transform:uppercase;padding-top:36px}
a:focus-visible{outline:2px solid var(--mar);outline-offset:2px}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Villa da Serra</h1>
    <div class="sub">locações de temporada</div>
  </header>

  <p class="rotulo">Guias do hóspede</p>

  <a class="cartao" href="golden-sea/">
    <img src="golden-sea/capa.jpg" alt="Piscina da Cobertura Golden Sea com vista para a praia da Enseada">
    <div class="corpo">
      <h2>Cobertura Golden Sea</h2>
      <p>Enseada, Guarujá</p>
      <span class="abrir">Abrir o guia</span>
    </div>
  </a>

  <a class="cartao" href="villa-da-serra-1/">
    <img src="villa-da-serra-1/capa.jpg" alt="Sala e cozinha da Villa da Serra I">
    <div class="corpo">
      <h2>Villa da Serra I</h2>
      <p>Paraty, Rio de Janeiro</p>
      <span class="abrir">Abrir o guia</span>
    </div>
  </a>

  <a class="cartao" href="villa-da-serra-2/">
    <img src="villa-da-serra-2/capa.jpg" alt="Piscina de vidro aquecida da Villa da Serra 2">
    <div class="corpo">
      <h2>Villa da Serra 2 · Casa 4</h2>
      <p>Paraty, Rio de Janeiro</p>
      <span class="abrir">Abrir o guia</span>
    </div>
  </a>

  <p class="rodape">Villa da Serra</p>
</div>
</body>
</html>
